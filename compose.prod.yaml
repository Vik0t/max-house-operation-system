services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dompuls
      POSTGRES_USER: dompuls
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dompuls -d dompuls"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - dompuls_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: dompuls-api:${APP_VERSION:-latest}
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg://dompuls:${POSTGRES_PASSWORD}@db:5432/dompuls
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      MAX_POLL_STATE_PATH: /var/lib/dompuls-bot/state.json
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 60s
    volumes:
      - dompuls_bot_state:/var/lib/dompuls-bot:ro
    restart: unless-stopped
    logging: *logging

  bot:
    image: dompuls-api:${APP_VERSION:-latest}
    command: ["python", "-m", "app.bot_worker"]
    env_file: .env.prod
    environment:
      DOMPULS_API_URL: http://api:8000
      MAX_POLL_STATE_PATH: /var/lib/dompuls-bot/state.json
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - dompuls_bot_state:/var/lib/dompuls-bot
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10.2-alpine
    environment:
      API_HOST: ${API_HOST:?API_HOST is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

volumes:
  dompuls_pgdata:
  dompuls_bot_state:
  caddy_data:
  caddy_config:
