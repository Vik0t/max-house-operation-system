services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dompuls
      POSTGRES_USER: dompuls
      POSTGRES_PASSWORD: dompuls
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dompuls -d dompuls"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - dompuls_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dompuls:dompuls@db:5432/dompuls
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - dompuls_bot_state:/var/lib/dompuls-bot:ro
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "app.bot_worker"]
    env_file: .env
    environment:
      DOMPULS_API_URL: http://api:8000
      MAX_POLL_STATE_PATH: /var/lib/dompuls-bot/state.json
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - dompuls_bot_state:/var/lib/dompuls-bot
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/miniapp/Dockerfile
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  dompuls_pgdata:
  dompuls_bot_state:
